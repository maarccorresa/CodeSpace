<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración — CodeSpace</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh; background: var(--cs-bg); color: var(--cs-text);
            display: grid; place-items: center; padding: 24px 16px;
        }
        .panel { position: relative; z-index: 1; width: 100%; max-width: 400px; padding: 32px 28px; }
        .head { text-align: center; margin-bottom: 26px; }
        .head img { width: 44px; height: 44px; margin-bottom: 14px; }
        .head h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -.02em; }
        .head p { margin-top: 6px; color: var(--cs-muted); font-size: .88rem; }
        .badge {
            display: block; margin-bottom: 10px;
            font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
            color: var(--cs-blue);
        }
        .field { margin-bottom: 16px; }
        .msg { display: none; margin-bottom: 16px; padding: 10px 12px; border-radius: var(--cs-radius); font-size: .86rem; }
        .msg.error { display: block; background: rgba(248,113,113,.1); color: #fca5a5; border: 1px solid rgba(248,113,113,.25); }
        .msg.ok { display: block; background: rgba(74,222,128,.1); color: #86efac; border: 1px solid rgba(74,222,128,.25); }
        .submit { width: 100%; margin-top: 6px; }
        .back { display: block; text-align: center; margin-top: 20px; font-size: .84rem; color: var(--cs-muted); text-decoration: none; }
        .back:hover { color: var(--cs-text); }
    </style>
</head>
<body>
    
    <main class="panel cs-card">
        <div class="head">
            <img src="/img/logo.svg" alt="">
            <div class="badge">Administración</div>
            <h1>Acceso al panel de control</h1>
            <p>Acceso para administradores y moderadores</p>
        </div>

        <div id="msg" class="msg" role="alert"></div>

        <form id="loginForm" novalidate>
            <div class="field">
                <label class="cs-label" for="email">Email</label>
                <input class="cs-input" type="email" id="email" autocomplete="username" required>
            </div>
            <div class="field">
                <label class="cs-label" for="password">Contraseña</label>
                <input class="cs-input" type="password" id="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="cs-btn cs-btn-primary submit" id="submitBtn">Entrar</button>
        </form>

        <a class="back" href="/">← Volver al inicio</a>
    </main>

    <script>
        const form = document.getElementById('loginForm');
        const msg = document.getElementById('msg');
        const btn = document.getElementById('submitBtn');

        function show(text, type) { msg.textContent = text; msg.className = 'msg ' + type; }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.className = 'msg';
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!email || !password) return show('Escribe el email y la contraseña', 'error');

            btn.disabled = true;
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok) {
                    show('Acceso concedido. Entrando…', 'ok');
                    location.href = data.redirect || '/admin';
                    return;
                }
                show(data.error || 'Credenciales inválidas', 'error');
            } catch {
                show('Error de conexión. Inténtalo de nuevo.', 'error');
            }
            btn.disabled = false;
        });

        document.getElementById('email').focus();
    </script>
</body>
</html>
